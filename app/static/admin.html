<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DearFuture · 管理</title>
    <style>
      :root {
        --ink: #17221f;
        --muted: #67736e;
        --line: #dce2dc;
        --paper: #f5f6f0;
        --card: #fffefa;
        --accent: #dc6840;
        --danger: #a63e32;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font: 16px/1.6 Georgia, "Noto Serif SC", serif;
      }
      .shell { width: min(1100px, calc(100% - 40px)); margin: 0 auto; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 0;
        border-bottom: 1px solid var(--line);
      }
      h1 { margin: 0; font-size: 30px; font-weight: 500; }
      h1 span { color: var(--accent); }
      a { color: var(--muted); }
      main { padding: 55px 0 80px; }
      .intro, .toolbar, .question {
        padding: 24px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .intro { margin-bottom: 20px; }
      .intro p { margin: 0 0 12px; color: var(--muted); }
      .intro p:last-child { margin-bottom: 0; font-size: 14px; }
      .login { display: flex; gap: 12px; align-items: end; }
      label { flex: 1; color: var(--muted); font: 12px Arial, sans-serif; }
      input, select, button {
        width: 100%;
        margin-top: 7px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 3px;
        font: 15px Georgia, "Noto Serif SC", serif;
      }
      button { width: auto; color: white; background: var(--accent); border: 0; cursor: pointer; }
      button.secondary { color: var(--ink); background: #edf0e9; }
      button.danger { background: var(--danger); }
      button:disabled { opacity: .55; cursor: wait; }
      .toolbar { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin-bottom: 20px; }
      .toolbar label { max-width: 220px; }
      #panel { display: none; }
      #message { min-height: 25px; margin: 15px 0; color: var(--muted); }
      #message.error { color: var(--danger); }
      .question { display: grid; grid-template-columns: 1fr auto; gap: 20px; margin-bottom: 12px; }
      .question h2 { margin: 0 0 8px; font-size: 19px; font-weight: 500; }
      .meta { color: var(--muted); font: 12px/1.7 Arial, sans-serif; }
      .error-detail { margin-top: 8px; color: var(--danger); font: 12px/1.6 Arial, sans-serif; }
      .status { display: inline-block; margin-left: 7px; padding: 2px 7px; border-radius: 10px; background: #edf0e9; }
      .status.deleted { color: white; background: var(--danger); }
      .actions { display: flex; align-items: center; gap: 8px; }
      .actions a { white-space: nowrap; font: 12px Arial, sans-serif; }
      .empty { padding: 40px; color: var(--muted); text-align: center; }
      @media (max-width: 700px) {
        .login, .toolbar, .question { display: block; }
        .login button, .toolbar button { margin-top: 12px; }
        .question .actions { margin-top: 18px; }
      }
    </style>
  </head>
  <body>
    <header class="shell">
      <h1>DearFuture<span>.</span> 管理</h1>
      <a href="/">回到慢递信墙</a>
    </header>
    <main class="shell">
      <section class="intro">
        <p>这里用于管理公开信件。移除操作是“软删除”，信件不会从数据库中真正消失，需要时可以恢复。</p>
        <p>管理口令只保存在当前浏览器会话中，不会显示在网址里，也不会出现在信件列表中。</p>
        <div class="login">
          <label>管理口令<input id="token" type="password" autocomplete="off" placeholder="输入 ADMIN_TOKEN" /></label>
          <button id="login" type="button">进入管理页</button>
        </div>
      </section>
      <p id="message" role="status"></p>
      <section id="panel">
        <div class="toolbar">
          <label>查看状态<select id="status-filter">
            <option value="">全部信件</option>
            <option value="scheduled">正在路上</option>
            <option value="verifying">正在验证</option>
            <option value="retry_pending">稍后重试</option>
            <option value="resolved">已回信</option>
            <option value="failed">验证失败</option>
            <option value="deleted">已移除</option>
          </select></label>
          <button class="secondary" id="refresh" type="button">刷新列表</button>
        </div>
        <div id="questions" aria-live="polite"></div>
      </section>
    </main>
    <script>
      const tokenInput = document.querySelector("#token");
      const message = document.querySelector("#message");
      const panel = document.querySelector("#panel");
      const list = document.querySelector("#questions");
      const filter = document.querySelector("#status-filter");
      const tokenKey = "dearFutureAdminToken";

      function token() {
        return sessionStorage.getItem(tokenKey) || tokenInput.value.trim();
      }

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = isError ? "error" : "";
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>'"]/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
        }[character]));
      }

      function formatDate(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Shanghai"
        }).format(new Date(value));
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: { Authorization: `Bearer ${token()}`, ...(options.headers || {}) }
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || "请求没有完成");
        return body;
      }

      async function loadQuestions() {
        if (!token()) {
          showMessage("请先输入管理口令。", true);
          return;
        }
        try {
          const query = filter.value ? `?status=${encodeURIComponent(filter.value)}` : "";
          const questions = await request(`/api/admin/questions${query}`);
          panel.style.display = "block";
          showMessage(`已加载 ${questions.length} 封信。`);
          list.innerHTML = questions.length ? questions.map(renderQuestion).join("") : '<div class="empty">这里暂时没有信件。</div>';
        } catch (error) {
          panel.style.display = "none";
          showMessage(error.message, true);
        }
      }

      function renderQuestion(question) {
        const deleted = question.is_deleted;
        const canRetry = !deleted && !["resolved", "verifying"].includes(question.status);
        const retryAction = canRetry
          ? `<button class="secondary" data-action="retry" data-id="${escapeHtml(question.public_id)}">立即重试</button>`
          : "";
        const action = deleted
          ? `<button class="secondary" data-action="restore" data-id="${escapeHtml(question.public_id)}">恢复到信墙</button>`
          : `${retryAction}<button class="danger" data-action="delete" data-id="${escapeHtml(question.public_id)}">从信墙移除</button>`;
        const retryAt = question.status === "verifying"
          ? "正在重新验证"
          : question.next_attempt_at
          ? `下次尝试：${formatDate(question.next_attempt_at)}`
          : "暂未安排重试";
        const error = question.last_error
          ? `<div class="error-detail">最近一次情况：${escapeHtml(question.last_error)}</div>`
          : "";
        return `<article class="question">
          <div>
            <h2>${escapeHtml(question.question)}</h2>
            <div class="meta">${escapeHtml(question.category)} · 约定 ${formatDate(question.check_at)}
              <span class="status ${deleted ? "deleted" : ""}">${escapeHtml(question.status)}</span></div>
            <div class="meta">创建于 ${formatDate(question.created_at)} · 已尝试 ${question.attempt_count} 次 · ${retryAt}</div>
            ${error}
          </div>
          <div class="actions">${action}<a href="/q/${encodeURIComponent(question.public_id)}" target="_blank" rel="noopener">查看信件</a></div>
        </article>`;
      }

      async function changeQuestion(id, action) {
        try {
          const encodedId = encodeURIComponent(id);
          const endpoint = action === "delete"
            ? `/api/admin/questions/${encodedId}`
            : action === "restore"
              ? `/api/admin/questions/${encodedId}/restore`
              : `/api/admin/questions/${encodedId}/retry`;
          const method = action === "delete" ? "DELETE" : "POST";
          const result = await request(endpoint, { method });
          showMessage(action === "retry" ? "小蜗牛已经开始重新验证这封信。" : result.message);
          await loadQuestions();
        } catch (error) {
          showMessage(error.message, true);
        }
      }

      document.querySelector("#login").addEventListener("click", () => {
        const value = tokenInput.value.trim();
        if (!value) return showMessage("请输入管理口令。", true);
        sessionStorage.setItem(tokenKey, value);
        loadQuestions();
      });
      document.querySelector("#refresh").addEventListener("click", loadQuestions);
      filter.addEventListener("change", loadQuestions);
      list.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (button) changeQuestion(button.dataset.id, button.dataset.action);
      });
      const savedToken = sessionStorage.getItem(tokenKey);
      if (savedToken) {
        tokenInput.value = savedToken;
        loadQuestions();
      }
    </script>
  </body>
</html>
